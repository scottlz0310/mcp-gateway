# Full MCP stack: mcp-gateway routing both github-mcp-server and copilot-review-mcp.
#
# Copy .env.example to .env and fill in your credentials, then run:
#   docker compose up -d
#
# MCP client endpoints (single OAuth façade via the gateway; backend services still
# require their own credentials/configuration in this Compose setup):
#   github-mcp:      http://127.0.0.1:8080/mcp/github
#   copilot-review:  http://127.0.0.1:8080/mcp/copilot-review

services:
  mcp-gateway:
    image: ghcr.io/scottlz0310/mcp-gateway:latest
    container_name: mcp-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MCP_GATEWAY_PORT:-8080}:${MCP_GATEWAY_PORT:-8080}"
    environment:
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-${GITHUB_MCP_CLIENT_ID:-}}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-${GITHUB_MCP_CLIENT_SECRET:-}}
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      # Bind on all interfaces so Docker port-forwarding works (container → host).
      # Port in MCP_GATEWAY_BIND_ADDR must match MCP_GATEWAY_PORT (both default to 8080).
      MCP_GATEWAY_BIND_ADDR: ${MCP_GATEWAY_BIND_ADDR:-0.0.0.0:8080}
      # Public URL is what the user's browser (and GitHub OAuth) calls.
      MCP_GATEWAY_PUBLIC_URL: ${MCP_GATEWAY_PUBLIC_URL:-http://127.0.0.1:8080}
      MCP_GATEWAY_PORT: ${MCP_GATEWAY_PORT:-8080}
      MCP_GATEWAY_KEY_PATH: ${MCP_GATEWAY_KEY_PATH:-/data/gateway.key}
      MCP_CONFIG_FILE: ${MCP_CONFIG_FILE:-/data/config.yaml}
      MCP_GATEWAY_TOKEN_STORE_PATH: ${MCP_GATEWAY_TOKEN_STORE_PATH:-/data/tokens.json}
      # Route longest-prefix-first; both routes served from a single gateway port.
      ROUTE_GITHUB: /mcp/github|http://github-mcp:8082|upstream_bearer_token_env=GITHUB_PERSONAL_ACCESS_TOKEN
      ROUTE_COPILOT_REVIEW: /mcp/copilot-review|http://copilot-review-mcp:8083
      OAUTH_SCOPES: ${OAUTH_SCOPES:-${GITHUB_MCP_OAUTH_SCOPES:-repo,user}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_MIN: ${SESSION_TTL_MIN:-10}
      TOKEN_CACHE_TTL_MIN: ${TOKEN_CACHE_TTL_MIN:-30}
    volumes:
      - ./data:/data
    depends_on:
      - github-mcp
      - copilot-review-mcp
    networks:
      - mcp-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  github-mcp:
    image: ${GITHUB_MCP_IMAGE:-ghcr.io/github/github-mcp-server:main}
    container_name: mcp-github
    restart: unless-stopped
    command: ["http", "--port", "8082"]
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Exposed only within the Docker network; access via mcp-gateway on port 8080.
    expose:
      - "8082"
    networks:
      - mcp-network
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.5"
          memory: 256M

  copilot-review-mcp:
    image: ${COPILOT_REVIEW_MCP_IMAGE:-ghcr.io/scottlz0310/copilot-review-mcp:main}
    container_name: copilot-review-mcp
    restart: unless-stopped
    # distroless:nonroot UID=65532
    user: "65532:65532"
    environment:
      # gateway mode trusts X-Authenticated-User injected by mcp-gateway and
      # avoids a second GitHub token validation in copilot-review-mcp.
      AUTH_MODE: ${COPILOT_REVIEW_AUTH_MODE:-gateway}
      BASE_URL: ${COPILOT_REVIEW_BASE_URL:-http://localhost:8083}
      MCP_PORT: ${COPILOT_REVIEW_MCP_PORT:-8083}
      GITHUB_OAUTH_SCOPES: ${OAUTH_SCOPES:-${GITHUB_MCP_OAUTH_SCOPES:-repo,user}}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_TTL_MIN: ${SESSION_TTL_MIN:-10}
      TOKEN_CACHE_TTL_MIN: ${TOKEN_CACHE_TTL_MIN:-30}
    # copilot-review-mcp is accessed exclusively through mcp-gateway.
    # Uncomment to also allow direct host access (standalone backward-compatible mode).
    # ports:
    #   - "127.0.0.1:${COPILOT_REVIEW_MCP_PORT:-8083}:${COPILOT_REVIEW_MCP_PORT:-8083}"
    expose:
      - "8083"
    volumes:
      - copilot-review-data:/data
    networks:
      - mcp-network
    healthcheck:
      disable: true
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  copilot-review-data:
    driver: local

networks:
  mcp-network:
    driver: bridge
